<style>
#boot{position:fixed;inset:0;z-index:9999;background:#050d0a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .4s ease;animation:bootKill .4s ease 12s forwards}
#boot.out{opacity:0;pointer-events:none}
#boot .bl{position:relative;width:112px;height:112px;display:grid;place-items:center}
#boot .bl img{width:74px;height:74px;animation:bootPulse 1.6s ease-in-out infinite}
#boot .bl::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(52,234,176,.14);border-top-color:#34eab0;animation:bootSpin .9s linear infinite}
#boot .bt{color:#cfe9df;font:600 15px/1.6 "Noto Sans Arabic","Noto Kufi Arabic",system-ui,sans-serif;direction:rtl;letter-spacing:.2px}
#boot .bt i{display:inline-block;width:5px;height:5px;margin:0 2px;border-radius:50%;background:#34eab0;animation:bootDot 1.2s infinite}
#boot .bt i:nth-child(2){animation-delay:.2s}#boot .bt i:nth-child(3){animation-delay:.4s}
@keyframes bootSpin{to{transform:rotate(360deg)}}
@keyframes bootPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(52,234,176,0))}50%{transform:scale(1.06);filter:drop-shadow(0 0 18px rgba(52,234,176,.45))}}
@keyframes bootDot{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes bootKill{to{opacity:0;visibility:hidden}}
</style>
</head>
